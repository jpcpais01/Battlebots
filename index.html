<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Auto 1v1 robot boxing arena. Build your bot, watch it fight." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Battlebots</title>
    <!--
      The loading screen's look lives here, not in style.css, so it is on screen before a single
      script has downloaded. Everything that moves on it moves by transform or opacity only: the
      browser keeps those running on its own while the game is busy building the arena.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #02040b;
      }
      .boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        overflow: hidden;
        color: #f4f7fc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background:
          radial-gradient(130% 75% at 50% 118%, #2350c8 0%, #102a78 26%, #071447 48%, #030820 72%, #02040b 100%);
        -webkit-user-select: none;
        user-select: none;
        --bar: min(58vw, 440px);
        transition: opacity 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s;
      }
      .bt-stage,
      .bt-stage > * {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      /* two slow pools of light drifting over the deep blue */
      .bt-aura i {
        position: absolute;
        border-radius: 50%;
        will-change: transform;
      }
      .bt-aura i:nth-child(1) {
        left: -20vw;
        top: -30vh;
        width: 90vw;
        height: 90vh;
        background: radial-gradient(closest-side, rgba(70, 120, 255, 0.28), transparent);
        animation: bt-drift 19s ease-in-out infinite alternate;
      }
      .bt-aura i:nth-child(2) {
        right: -25vw;
        top: 10vh;
        width: 80vw;
        height: 80vh;
        background: radial-gradient(closest-side, rgba(130, 90, 255, 0.2), transparent);
        animation: bt-drift 23s ease-in-out -7s infinite alternate-reverse;
      }
      @keyframes bt-drift {
        from {
          transform: translate(0, 0) scale(1);
        }
        to {
          transform: translate(12vw, 8vh) scale(1.15);
        }
      }
      /* the ribbons of light flowing across: each strip is two periods wide and slides one along */
      .bt-waves {
        top: auto !important;
        height: 54vh;
        bottom: 4vh !important;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
        mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
      }
      .bt-wave {
        position: absolute;
        left: 0;
        top: 0;
        width: 200%;
        height: 100%;
        animation: bt-flow 26s linear infinite;
        will-change: transform;
      }
      .bt-wave svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .bt-wave.b {
        animation-duration: 41s;
        opacity: 0.8;
      }
      /* (the glow is wide faint strokes, not a blur filter: a filter is redone every frame it moves) */
      @keyframes bt-flow {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }
      /* dust in the light, rising (fixed keyframes, so the browser can play them on its own) */
      .bt-dust i {
        position: absolute;
        bottom: -2vh;
        opacity: 0;
        animation: bt-rise-a linear infinite;
        will-change: transform, opacity;
      }
      .bt-dust b {
        display: block;
        border-radius: 50%;
        background: #e6f3ff;
        box-shadow: 0 0 6px 1px rgba(140, 200, 255, 0.8);
      }
      @keyframes bt-rise-a {
        0% {
          opacity: 0;
          transform: translate(0, 0);
        }
        18%,
        75% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(-6vw, -78vh);
        }
      }
      @keyframes bt-rise-b {
        0% {
          opacity: 0;
          transform: translate(0, 0);
        }
        18%,
        75% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(1vw, -78vh);
        }
      }
      @keyframes bt-rise-c {
        0% {
          opacity: 0;
          transform: translate(0, 0);
        }
        18%,
        75% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(7vw, -78vh);
        }
      }
      .bt-vig {
        background: radial-gradient(ellipse 75% 70% at 50% 46%, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
      }
      .bt-mid {
        position: absolute;
        left: 50%;
        top: 44%;
        width: var(--bar);
        display: grid;
        justify-items: center;
        transform: translate(-50%, -50%);
        transition:
          transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 0.5s ease;
      }
      .bt-logo {
        font-family: 'Russo One', system-ui, sans-serif;
        font-style: italic;
        font-size: min(11vh, 8.8vw, 68px);
        line-height: 1;
        white-space: nowrap;
        letter-spacing: 0.03em;
        padding-right: 0.12em;
        margin-bottom: min(5.5vh, 34px);
        filter: drop-shadow(0 0 22px rgba(90, 150, 255, 0.45)) drop-shadow(0 4px 14px rgba(0, 0, 0, 0.5));
        opacity: 0;
        transform: translateY(0.3em) scale(0.97);
        transition:
          opacity 0.9s ease,
          transform 1.1s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .bt-logo span {
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .bt-logo .l1 {
        background-image: linear-gradient(180deg, #ffffff 30%, #b9cdff);
      }
      .bt-logo .l2 {
        background-image: linear-gradient(180deg, #ffc15a, #ff6a12);
      }
      .boot.fonts .bt-logo {
        opacity: 1;
        transform: none;
      }
      /* the progress line: the fill and its bright head slide in together */
      .bt-bar {
        position: relative;
        width: 100%;
        height: 3px;
      }
      .bt-track {
        position: absolute;
        inset: 0;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.13);
      }
      .bt-fill,
      .bt-head {
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        will-change: transform;
      }
      .bt-fill {
        background: linear-gradient(90deg, rgba(80, 150, 255, 0.35), #9fd2ff 70%, #ffffff);
      }
      .bt-head::after {
        content: '';
        position: absolute;
        right: -9px;
        top: 50%;
        width: 18px;
        height: 18px;
        margin-top: -9px;
        border-radius: 50%;
        background: radial-gradient(closest-side, #fff, rgba(160, 210, 255, 0.55) 35%, transparent);
        transition: opacity 0.4s;
      }
      .bt-row {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1em;
        margin-top: 12px;
        font-size: 13px;
        letter-spacing: 0.04em;
        color: rgba(222, 232, 255, 0.78);
      }
      .bt-what {
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: opacity 0.25s;
      }
      .bt-pct {
        font-variant-numeric: tabular-nums;
        color: rgba(222, 232, 255, 0.5);
      }
      /* the console-style busy mark, bottom right */
      /* (it turns a plain box, never the SVG itself: only that is sure to turn on its own) */
      .bt-spin {
        position: absolute;
        right: max(22px, env(safe-area-inset-right));
        bottom: max(20px, env(safe-area-inset-bottom));
        width: 26px;
        height: 26px;
        animation: bt-turn 1.1s linear infinite;
        will-change: transform;
        transition: opacity 0.4s;
      }
      .bt-spin svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .bt-spin circle {
        fill: none;
        stroke: #fff;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-dasharray: 38 63;
        filter: drop-shadow(0 0 3px rgba(150, 200, 255, 0.9));
      }
      @keyframes bt-turn {
        to {
          transform: rotate(360deg);
        }
      }
      .bt-tip {
        position: absolute;
        left: max(24px, env(safe-area-inset-left));
        bottom: max(20px, env(safe-area-inset-bottom));
        margin: 0;
        max-width: min(46vw, 34em);
        font-size: 13px;
        line-height: 1.4;
        color: rgba(214, 224, 245, 0.66);
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 0.6s ease,
          transform 0.6s ease;
      }
      .bt-tip.on {
        opacity: 1;
        transform: none;
      }
      .bt-tip b {
        display: inline-block;
        margin-right: 0.7em;
        padding: 0.18em 0.6em;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.14em;
        color: #fff;
        vertical-align: 0.1em;
      }
      /* done: the line flashes white, then everything lifts away onto the game */
      .boot.full .bt-fill {
        background: #fff;
        box-shadow: 0 0 12px #fff;
      }
      .boot.full .bt-head::after,
      .boot.full .bt-spin {
        opacity: 0;
      }
      .boot.out {
        opacity: 0;
        pointer-events: none;
      }
      .boot.out .bt-mid {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.08);
      }
      .boot.failed .bt-fill {
        background: #ff4d6a;
      }
      .boot.failed .bt-spin {
        display: none;
      }
      .bt-retry {
        display: none;
        margin-top: 20px;
        padding: 0.7em 1.8em;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #02040b;
        font: 600 14px system-ui, sans-serif;
      }
      .boot.failed .bt-retry {
        display: block;
      }
      @media (max-height: 420px) {
        .bt-row,
        .bt-tip {
          font-size: 12px;
        }
      }
      /* tall screens: the tip sits centred under the line */
      @media (max-aspect-ratio: 1/1) {
        .boot {
          --bar: min(74vw, 440px);
        }
        .bt-tip {
          left: 50%;
          bottom: max(64px, calc(env(safe-area-inset-bottom) + 44px));
          width: 84vw;
          max-width: none;
          text-align: center;
          transform: translate(-50%, 6px);
        }
        .bt-tip.on {
          transform: translate(-50%, 0);
        }
        .bt-spin {
          right: 50%;
          margin-right: -13px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bt-aura i,
        .bt-wave {
          animation: none;
        }
        .bt-dust {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="vignette"></div>
    <div id="ui"></div>
    <div id="boot" class="boot" role="progressbar" aria-label="Loading Battlebots" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="bt-stage" aria-hidden="true">
        <div class="bt-aura"><i></i><i></i></div>
        <div class="bt-waves"></div>
        <div class="bt-dust"></div>
        <div class="bt-vig"></div>
      </div>
      <div class="bt-mid">
        <div class="bt-logo"><span class="l1">BATTLE</span><span class="l2">BOTS</span></div>
        <div class="bt-bar" aria-hidden="true">
          <div class="bt-track"><div class="bt-fill"></div></div>
          <div class="bt-head"></div>
        </div>
        <div class="bt-row">
          <p class="bt-what">Loading</p>
          <span class="bt-pct" aria-hidden="true">0%</span>
        </div>
        <button class="bt-retry" type="button" onclick="location.reload()">Try again</button>
      </div>
      <p class="bt-tip"></p>
      <div class="bt-spin" aria-hidden="true"><svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="10" /></svg></div>
    </div>
    <script>
      // The flowing ribbons and the dust, drawn here so they're up with the first paint.
      (function () {
        var boot = document.getElementById('boot');
        if (!boot) return;
        var TAU = Math.PI * 2;
        // a bundle of ribbons, each a sum of waves that repeat every 800 units, drawn 1600 wide so
        // sliding the strip half its width loops without a seam
        function curve(base, a1, p1, a2, p2) {
          var d = '';
          for (var x = 0; x <= 1600; x += 16) {
            var y = base + a1 * Math.sin((TAU * x) / 800 + p1) + a2 * Math.sin((TAU * x) / 400 + p2);
            d += (x ? 'L' : 'M') + x + ' ' + y.toFixed(1);
          }
          return d;
        }
        function strip(cls, n, base, p0, color, width, sheet) {
          var paths = '';
          var first = '', last = '';
          for (var i = 0; i < n; i++) {
            var d = curve(base + i * 7, 62 - i * 5, p0 + i * 0.16, 16 + i * 2, p0 * 1.7 - i * 0.22);
            if (!i) first = d;
            last = d;
            var a = 0.12 + 0.5 * Math.sin((Math.PI * (i + 0.5)) / n);
            // a glow strip lays each ribbon down several times, wide and faint
            var layers = cls === 'glow' ? [[46, 0.05], [28, 0.07], [14, 0.09]] : [[width, a]];
            for (var l = 0; l < layers.length; l++)
              paths += '<path d="' + d + '" stroke="' + color + '" stroke-opacity="' + layers[l][1].toFixed(2) + '" stroke-width="' + layers[l][0] + '" stroke-linecap="round" fill="none" vector-effect="non-scaling-stroke"/>';
          }
          if (sheet) {
            // a faint sheet of light between the outer ribbons
            var back = last.slice(1).split('L').reverse().join('L');
            paths = '<path d="' + first + 'L' + back + 'Z" fill="' + color + '" fill-opacity="0.07"/>' + paths;
          }
          return '<div class="bt-wave ' + cls + '"><svg viewBox="0 0 1600 300" preserveAspectRatio="none">' + paths + '</svg></div>';
        }
        var waves = boot.querySelector('.bt-waves');
        waves.innerHTML =
          strip('glow', 3, 150, 0.4, '#3d7dff', 18, false) +
          strip('b', 6, 170, 2.6, '#9a8cff', 1, true) +
          strip('a', 9, 140, 0.4, '#a8d8ff', 1.2, true);
        var dust = boot.querySelector('.bt-dust');
        var html = '';
        for (var k = 0; k < 34; k++) {
          var size = (1 + Math.random() * 2).toFixed(1);
          html +=
            '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;animation-name:bt-rise-' + 'abc'.charAt(k % 3) +
            ';animation-duration:' + (11 + Math.random() * 14).toFixed(1) + 's;animation-delay:-' + (Math.random() * 25).toFixed(1) + 's">' +
            '<b style="width:' + size + 'px;height:' + size + 'px;opacity:' + (0.35 + Math.random() * 0.6).toFixed(2) + '"></b></i>';
        }
        dust.innerHTML = html;
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
