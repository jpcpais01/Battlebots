<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/examples/jsm/": "/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="c" width="64" height="64"></canvas>
<script type="module">
const job = new URLSearchParams(location.search).get('job');
window.__bake = import(`/godot/tools/bake/web/${job}.ts`).then((m) => m.run()).then(
  (r) => { window.__done = r ?? 'ok'; },
  (e) => { window.__done = 'ERROR ' + (e && e.stack || e); },
);
</script>
</body>
</html>
