# Builds the Android app (godot/) and the Windows build of it, and publishes both on the repo's
# Releases page whenever main changes something in godot/. The newest builds are always at
#   https://github.com/<owner>/<repo>/releases/latest/download/Battlebots.apk
#   https://github.com/<owner>/<repo>/releases/latest/download/Battlebots-Windows.zip
# with patch-notes.json beside them (the newest groups of src/patchNotes.ts): the app checks the
# latest release at launch and offers it, notes and all (godot/app/update/updater.gd). The zip
# holds Battlebots.exe (the whole game in one file) and the store art beside it; the release also
# carries that Battlebots.exe on its own, for builds from before the zip (tools/build-windows.sh).
#
# Signing needs three repository secrets (Settings > Secrets and variables > Actions), all from
# the project's release keystore, so every build installs over the one before:
#   ANDROID_KEYSTORE_BASE64  the keystore file, base64-encoded
#   ANDROID_KEY_ALIAS        its key alias
#   ANDROID_KEY_PASSWORD     its password
name: Android release

on:
  push:
    branches: [main]
    # (public/voice too: the app ships the web game's commentary clips, see the packaging step)
    paths: ["godot/**", "public/voice/**", ".github/workflows/android-release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      BB_TOOLS: ${{ github.workspace }}/../bb-tools
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing secrets
        id: secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$ALIAS" ] || [ -z "$PASS" ]; then
            echo "::warning::No release yet: add the ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets (see the top of this workflow), then run it again."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and its export templates
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BB_TOOLS }}/godot
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-android-windows

      - name: Set up Godot
        if: steps.secrets.outputs.ok == 'true'
        run: |
          python3 -m pip install --quiet cryptography
          mkdir -p "$BB_TOOLS"
          echo "$BB_TOOLS/bin" >> "$GITHUB_PATH"
          PATH="$BB_TOOLS/bin:$PATH" sh godot/tools/setup-container.sh

      # The commentary clips aren't in godot/: they are the web game's public/voice (manifest and
      # ~4,500 mp3s), which this repo checkout has. pack-voice.py copies them into
      # godot/assets/voice (gitignored) and bakes the robot's ring-mod and comb into its clips
      # with ffmpeg; build-apk.sh runs it again, which then finds nothing left to do.
      - name: Package the commentary clips
        if: steps.secrets.outputs.ok == 'true'
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          test -f public/voice/manifest.json
          python3 godot/tools/pack-voice.py

      - name: Build the APK
        if: steps.secrets.outputs.ok == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KS" | base64 -d > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          # each build is a newer version, so phones update in place (1 was the hand-made phase 1 APK)
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          sed -i -e "s/^version\/code=.*/version\/code=$VERSION_CODE/" \
                 -e "s/^version\/name=.*/version\/name=\"$VERSION_NAME\"/" godot/export_presets.cfg
          # (and the app shows it on the home screen)
          sed -i -e "s/^config\/version=.*/config\/version=\"$VERSION_NAME\"/" godot/project.godot
          sh godot/tools/build-apk.sh "$RUNNER_TEMP/Battlebots.apk"
          python3 godot/tools/apksigner.py verify "$RUNNER_TEMP/Battlebots.apk"
          rm -f "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"

      # (the same version, stamped above; Windows builds aren't signed)
      - name: Build the Windows zip
        if: steps.secrets.outputs.ok == 'true'
        run: sh godot/tools/build-windows.sh "$RUNNER_TEMP/win"

      - name: Publish the release
        if: steps.secrets.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Battlebots for Android and Windows, build $VERSION_NAME."
            echo
            echo "On your phone: download **Battlebots.apk** below and open it. Android asks once to allow installs from your browser. It installs over the previous build. From this build on, the app offers new builds itself on its home screen."
            echo
            echo "On a Windows PC: download **Battlebots-Windows.zip**, unzip it (Extract All puts it in Downloads\\Battlebots-Windows) and run **Battlebots.exe**: it is the whole game in one file, with its banner, cover and logo beside it. Windows may warn about an unknown app the first time: More info, then Run anyway. The game offers new builds itself: it unzips them into your Downloads folder and opens again from there."
            echo
            echo "(The loose Battlebots.exe below is the same game, there so Windows builds from before the zip can update themselves. Download the zip.)"
            echo
            echo "Latest change: $(git log -1 --format=%s)"
          } > "$RUNNER_TEMP/notes.md"
          # (what the app's update card shows before it installs this build)
          python3 godot/tools/patch-notes-json.py "$RUNNER_TEMP/patch-notes.json"
          # (GitHub's API sometimes answers 502 and may have made the release anyway: retry, and
          # finish a release that exists without its APK)
          TAG="android-v$VERSION_NAME"
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" "$RUNNER_TEMP/Battlebots.apk" "$RUNNER_TEMP/win/Battlebots-Windows.zip" "$RUNNER_TEMP/win/Battlebots.exe" "$RUNNER_TEMP/patch-notes.json" --clobber \
                && gh release edit "$TAG" --draft=false --latest && break
            else
              gh release create "$TAG" "$RUNNER_TEMP/Battlebots.apk" "$RUNNER_TEMP/win/Battlebots-Windows.zip" "$RUNNER_TEMP/win/Battlebots.exe" "$RUNNER_TEMP/patch-notes.json" \
                --title "Battlebots $VERSION_NAME (Android + Windows)" \
                --notes-file "$RUNNER_TEMP/notes.md" \
                --target "$GITHUB_SHA" --latest && break
            fi
            sleep $((i * 15))
          done
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets.txt"
          grep -qx Battlebots.apk "$RUNNER_TEMP/assets.txt"
          grep -qx Battlebots-Windows.zip "$RUNNER_TEMP/assets.txt"
          grep -qx Battlebots.exe "$RUNNER_TEMP/assets.txt"
